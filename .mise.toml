[tasks.update]
description = "Update all flake inputs"
run = "nix flake update"

[tasks.update-unstable]
description = "Update only nixpkgs-unstable"
run = "nix flake update nixpkgs-unstable"

[tasks.update-home-manager]
description = "Update home-manager input"
run = "nix flake update home-manager"

[tasks.system]
description = "Build and switch system config (requires sudo)"
run = """
# Homebrew's tap-trust store (~/.homebrew/trust.json for user 'private') has been observed
# to get wiped by `brew bundle --cleanup --force` during activation, causing
# 'Refusing to load formula can1357/tap/omp from untrusted tap' on darwin-rebuild switch.
# Re-trust unconditionally (idempotent, cheap) before every switch as a guard.
sudo -u private env HOME=/Users/private HOMEBREW_CACHE=/Users/private/Library/Caches/Homebrew brew trust can1357/tap
sudo darwin-rebuild switch --flake .#Sebastians-MacBook-Pro-2
"""

[tasks.check]
description = "Validate configuration without building"
run = "sudo darwin-rebuild check --flake .#Sebastians-MacBook-Pro-2"

[tasks.build]
description = "Build system without switching"
run = "sudo darwin-rebuild build --flake .#Sebastians-MacBook-Pro-2"

[tasks.user]
description = "Switch home-manager for current user"
run = "home-manager switch --flake .#$USER -b backup"

[tasks.deploy-herdr]
description = "Deploy home-manager profile to herdr"
run = 'ssh herdr.tail "nix run home-manager/release-26.05 -- switch --flake github:fellnerse/nix-darwin#root -b backup"'

[tasks.hydra-check]
description = "Check package availability in Hydra cache"
run = "nix-shell -p hydra-check --run 'hydra-check uv --arch aarch64-darwin --channel nixpkgs-unstable'"

[tasks.gc]
description = "Garbage collect Nix store (keeps 14d of generations)"
run = """
# /etc/static is no GC root: if drifted, GC eats the etc that /etc needs (kills PATH, flakes, sudo).
# Idempotent relink, same as activation does. Why: docs/solutions/system-issues/reclaiming-disk-space-nix-darwin.md
sudo ln -sfn "$(readlink -f /run/current-system/etc)" /etc/static
# Bare `-d` leaves nothing to roll back to.
sudo nix-collect-garbage --delete-older-than 14d
# nix-collect-garbage skips the standalone profiles in ~/.local/state/nix/profiles.
nix-env --delete-generations 14d
nix-env -p ~/.local/state/nix/profiles/home-manager --delete-generations 14d
nix-store --gc
"""
